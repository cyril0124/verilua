# Run `./scripts/setup-precommit.sh` once per clone to install the git hooks.
# Hooks are executed by prek (https://github.com/j178/prek), a Rust drop-in
# replacement for pre-commit that reads this same config file.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
        exclude: ^\.(vscode|emmyrc)|tsconfig
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
  - repo: local
    hooks:
      - id: format-lua
        name: format-lua
        entry: xmake run format-lua
        language: system
        pass_filenames: false
        files: \.(lua)$
        exclude: (^|/)xmake\.lua$
      - id: lsp-check-lua
        name: lsp-check-lua
        entry: xmake run lsp-check-lua
        language: system
        pass_filenames: false
        files: \.(lua)$
        exclude: (^|/)xmake\.lua$
      - id: format-cpp
        name: format-cpp
        entry: xmake run format-cpp
        language: system
        pass_filenames: false
        files: \.(cpp|hpp|h|c)$
      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: \.rs$
      # Slow (full build): only on push.
      - id: cargo-clippy
        name: cargo-clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: \.rs$

