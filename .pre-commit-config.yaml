# Run `./scripts/setup-precommit.sh` once per clone to install the git hooks.
# Hooks are executed by prek (https://github.com/j178/prek), a Rust drop-in
# replacement for pre-commit that reads this same config file.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
        exclude: ^\.(vscode|emmyrc)|tsconfig
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
  - repo: local
    hooks:
      # Whole-tree runners (pass_filenames: false) would reformat out-of-scope
      # files at push time and hang/fail on a dirty tree; gate them to commits.
      - id: format-lua
        name: format-lua
        entry: xmake run format-lua
        language: system
        pass_filenames: false
        files: \.(lua)$
        exclude: (^|/)xmake\.lua$
      - id: lsp-check-lua
        name: lsp-check-lua
        entry: xmake run lsp-check-lua
        language: system
        pass_filenames: false
        files: \.(lua)$
        exclude: (^|/)xmake\.lua$
      # Formats the staged files only. `xmake run format-cpp` walks all of
      # src/** and rewrites files that predate the current format config, which
      # fails every commit that touches an unrelated C/C++ file.
      - id: format-cpp
        name: format-cpp
        entry: clang-format -i
        language: system
        files: \.(cpp|hpp|h|c)$
        exclude: (^|/)(svdpi|vpi_user|lightsss)
      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: \.rs$
      # Slow (full build): only on push.
      - id: cargo-clippy
        name: cargo-clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: \.rs$

